<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contact &amp; Rules | WiredPossum4's Collection</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☘️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,500;0,700;1,500;1,700;1,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@500;600;700;800&family=Inter+Tight:wght@700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#2f2a24;--bg2:#24201b;--surface:#40382e;--surface2:#4c4337;--ink:#f6f0e1;--muted:#b9ad98;--line:#4f4639;
  --green:#9bad50;--green-d:#6f8030;--orange:#b5562f;--orange-d:#8f4120;--orange-l:#df7f52;
  --disp:Besley,Georgia,serif;--mono:"Courier Prime","Courier New",monospace}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav,70px) + 70px)}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;color:var(--ink);background:var(--bg);font:500 16px/1.6 Manrope,system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:inherit}
::placeholder{color:#968b78}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* floating pill nav */
nav{position:sticky;top:0;z-index:30;padding:10px 20px 0;pointer-events:none}
.navin{pointer-events:auto;max-width:1120px;margin:0 auto;padding:8px 10px 8px 24px;display:flex;align-items:center;gap:8px 14px;
  background:rgba(47,42,36,.93);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:99px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.brand{display:inline-flex;align-items:baseline;gap:6px;font:800 1.25rem "Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:-.03em;color:var(--ink);text-decoration:none;margin-right:10px;white-space:nowrap}
.brand i{font:400 1.5rem Yellowtail,cursive;letter-spacing:0;color:var(--orange-l)}
.links{display:flex;gap:2px;overflow-x:auto}
.links a{padding:8px 16px;border-radius:99px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.links a:hover{background:var(--surface2)}
.links a.on{background:var(--green);color:#2f2a24}
.trade{margin-left:auto;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:700;font-size:.8rem;padding:7px 15px;border-radius:99px;background:rgba(155,173,80,.16);border:1.5px solid var(--green);color:var(--ink)}
.trade::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.trade.mid{background:rgba(223,127,82,.16);border-color:var(--orange-l);color:#ffd9c4}.trade.mid::before{background:var(--orange-l)}
.trade.off{background:rgba(181,86,47,.22);border-color:var(--orange);color:#f4cdb8}.trade.off::before{background:var(--orange-l)}
.reqbtn{display:inline-block;white-space:nowrap;text-decoration:none;font-weight:700;font-size:.9rem;background:var(--orange);color:#fff3e6;border-radius:99px;padding:10px 18px}
.reqbtn b{margin-left:8px;background:#fff3e6;color:var(--orange-d);border-radius:99px;padding:1px 9px}
.reqbtn:hover{background:var(--orange-d)}.reqbtn.on{outline:2px solid var(--green);outline-offset:2px}
@media(max-width:1180px){.navin{flex-wrap:wrap;border-radius:28px;padding:10px 16px}}

/* split hero */
.wrap.hero{padding-top:26px;padding-bottom:0}
.heroin{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:1.05fr .95fr;min-height:440px;border-radius:30px;background:#26221d;box-shadow:inset 0 0 0 1.5px var(--line)}
.heroin::before,.heroin::after{content:"";position:absolute;top:0;right:0;bottom:0;width:60%;pointer-events:none;
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 32%);mask:linear-gradient(90deg,transparent 0,#000 32%)}
.heroin::before{z-index:0;background:
  radial-gradient(38% 50% at 22% 18%,#dfe8a8 0,rgba(223,232,168,0) 72%),radial-gradient(42% 58% at 82% 22%,#9bad50 0,rgba(155,173,80,0) 72%),
  radial-gradient(40% 52% at 74% 88%,#b5562f 0,rgba(181,86,47,0) 74%),radial-gradient(34% 44% at 14% 84%,#e9b48c 0,rgba(233,180,140,0) 72%),
  radial-gradient(70% 80% at 50% 55%,#5b6a28 0,rgba(91,106,40,0) 80%),#3b3a22}
.heroin::after{z-index:1;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%200%200%200%200%201%200%200%200%200%201%200%200%200%20.6%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E");opacity:.45;mix-blend-mode:overlay}
@media(prefers-reduced-motion:no-preference){.heroin::before{animation:drift 16s ease-in-out infinite alternate}}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.14) translate(-3%,3%)}}
.hl{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:30px 44px 34px}
.hmeta{display:flex;justify-content:space-between;gap:12px;font:500 .76rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#b9ad98}
.heroin h1{margin:0;display:flex;flex-direction:column;align-items:flex-start}
.scr{position:relative;z-index:1;margin:0 0 -.16em .04em;font:400 clamp(2.6rem,5.8vw,4.6rem)/1 Yellowtail,cursive;color:var(--orange-l);transform:rotate(-4deg);transform-origin:left bottom}
.blk{font:800 clamp(3.4rem,8.6vw,7.4rem)/.9 "Inter Tight","Helvetica Neue",Arial,sans-serif;letter-spacing:-.045em;color:var(--ink)}
.hbot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sub{margin:0;max-width:30ch;color:#cfc6b2;font:500 .98rem/1.5 var(--mono)}
.browse{font:600 .82rem Manrope,sans-serif;color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--green);padding-bottom:2px;white-space:nowrap}
.browse:hover{color:var(--green)}
.hr{position:relative;z-index:2;display:grid;place-items:center;padding:36px 40px 36px 0}
.glass{width:100%;max-width:440px;padding:16px 18px 18px;border-radius:20px;color:#fff;background:rgba(31,27,23,.36);border:1px solid rgba(246,240,225,.34);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-weight:600;font-size:.95rem}
.gl{display:inline-flex;align-items:center;gap:9px}
.gstat{font:500 .85rem var(--mono);color:#e6dfcc}
.glass .search{width:100%;flex:none;padding:12px 20px;color:#fff;background:rgba(246,240,225,.12);border-color:rgba(246,240,225,.3)}
.glass .search::placeholder{color:#d8cfba}
.glass select{width:100%;margin-top:10px;padding:9px 18px;color:#fff;background:rgba(246,240,225,.12);border-color:rgba(246,240,225,.3)}
.glass .search:focus-visible,.glass select:focus-visible{outline-color:#fff}
@media(max-width:860px){
  .heroin{grid-template-columns:1fr;min-height:0}
  .heroin::before,.heroin::after{top:auto;left:0;width:100%;height:58%;-webkit-mask:linear-gradient(180deg,transparent 0,#000 30%);mask:linear-gradient(180deg,transparent 0,#000 30%)}
  .hl{padding:26px 24px 22px}.hr{padding:14px 20px 28px}
}

/* collection controls */
#collection{padding-top:44px}
.tabs{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 18px}
.tab{flex:1 1 150px;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;padding:18px 20px 16px;border-radius:28px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:italic 700 1.5rem/1.1 var(--disp)}
.tab small{margin-top:5px;font:600 .82rem Manrope,sans-serif;color:var(--muted)}
.tab:hover{border-color:var(--green)}
.tab[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#2f2a24}
.tab[aria-pressed=true] small{color:#3d3d22}
.bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.search{flex:1 1 260px;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:13px 24px}
select{font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:10px 20px}
.alpha{position:sticky;top:calc(var(--nav,70px) + 8px);z-index:20;display:flex;justify-content:safe center;overflow-x:auto;background:rgba(47,42,36,.95);backdrop-filter:blur(6px);
  border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;margin-bottom:12px}
.alpha a,.alpha span{padding:4px 8px;min-width:30px;text-align:center;font-weight:700;font-size:.95rem;text-decoration:none;border-radius:99px}
.alpha a{color:var(--ink)}.alpha a:hover{background:var(--green);color:#2f2a24}.alpha span{opacity:.3}
.list{display:grid;gap:34px;padding:16px 0 50px}
.letter{display:flex;align-items:center;gap:16px;margin:8px 0 -10px;font:italic 700 3.1rem/1 var(--disp);color:var(--orange-l)}
.letter::after{content:"";flex:1;border-top:1.5px solid var(--line)}

/* ticket cards: green, dark, orange */
.card{--cb:var(--surface);--cf:#f6f0e1;--cm:#b9ad98;--ca:#9bad50;--cs:#2a2520;--ps:#9bad50;--pl:#2f2a24;
  display:grid;grid-template-columns:168px 1fr;background:var(--cb);color:var(--cf);border:1.5px solid color-mix(in srgb,var(--cf) 16%,transparent);border-radius:34px;position:relative}
.t1{--ps:#b5562f;--pl:#fff3e6}
.t2{--ps:#f6f0e1;--pl:#2f2a24}
.card::before,.card::after{content:"";position:absolute;left:156px;width:24px;height:24px;border-radius:50%;background:var(--bg);z-index:1}
.card::before{top:-13px}.card::after{bottom:-13px}
.stub{border-radius:32px 0 0 32px;border-right:2px dashed color-mix(in srgb,var(--cf) 38%,transparent);background:var(--cs);padding:22px 18px}
.poster{position:sticky;top:calc(var(--nav,70px) + 76px);width:100%;aspect-ratio:2/3;border-radius:20px;overflow:hidden;background:var(--ps);border:4px solid #f6f0e1;
  box-shadow:0 8px 20px rgba(0,0,0,.4);display:grid;place-items:center}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .ltr{font:700 4.4rem var(--disp);color:var(--pl)}
.body{padding:26px 30px 16px;font-family:var(--mono)}
h2.t{font:700 clamp(1.8rem,4vw,2.5rem)/1.1 var(--disp);margin:0 0 8px}
.meta{color:var(--cm);font-weight:700;font-size:.9rem;margin:0 0 6px}
.viewings{position:relative;margin:16px 0 8px;padding-left:26px}
.viewings::before{content:"";position:absolute;left:5px;top:8px;bottom:12px;width:2px;background:color-mix(in srgb,var(--cf) 30%,transparent)}
.v{position:relative;padding:0 0 20px}
.v::before{content:"";position:absolute;left:-26px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--ca);box-shadow:0 0 0 4px var(--cb)}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.v h3{margin:0;font:700 1.1rem var(--mono)}
.acts{display:flex;align-items:center;gap:8px}
.cp{width:30px;height:30px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--cf) 40%,transparent);background:transparent;color:var(--cf);display:grid;place-items:center;cursor:pointer;padding:0}
.cp:hover{background:color-mix(in srgb,var(--cf) 16%,transparent)}
.cp .i-ok{display:none}.cp.ok{background:var(--cf);color:var(--cb)}.cp.ok .i-copy{display:none}.cp.ok .i-ok{display:block}
.req{font:700 .78rem var(--mono);border:1.5px solid var(--ca);background:transparent;color:var(--ca);border-radius:99px;padding:4px 14px;cursor:pointer;white-space:nowrap}
.req:hover{background:color-mix(in srgb,var(--ca) 18%,transparent)}.req.on{background:var(--ca);color:var(--cb)}
.where{margin:4px 0 6px;color:var(--cm);font-size:.95rem;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.pill{display:inline-block;padding:2px 12px;border-radius:99px;font:700 .74rem var(--mono);text-transform:uppercase;letter-spacing:.03em;text-decoration:none;color:var(--cf);
  background:color-mix(in srgb,var(--cf) 13%,transparent);border:1.5px solid color-mix(in srgb,var(--cf) 32%,transparent)}
a.pill:hover{background:color-mix(in srgb,var(--cf) 26%,transparent)}
.file{display:inline-block;margin:0 0 8px;padding:2px 14px;border-radius:99px;font-size:.84rem;font-weight:700;background:color-mix(in srgb,var(--cf) 12%,transparent)}
.v p.f{margin:3px 0;font-size:.95rem}
.v p.f b{font-weight:700;color:var(--ca);margin-right:8px}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* pages, form, footer */
.pg{padding-top:56px;padding-bottom:20px}
.pt{font:italic 700 clamp(2.6rem,7vw,4.2rem)/1.05 var(--disp);letter-spacing:-.01em;margin:0 0 26px}
.pt em{color:var(--orange-l)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:34px;padding:30px 34px;margin:0 0 26px}
.panel ul{margin:8px 0 0;padding-left:20px}
.panel ul.requl{list-style:none;padding:0;margin:8px 0 18px}
.requl li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.requl button{border:0;background:none;color:var(--orange-l);font-weight:700;cursor:pointer}
.requl a{color:var(--green);font-weight:700}
form label{display:block;font-weight:700;margin:18px 0 6px}
.panel input,.panel textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg2);border:1.5px solid var(--line);border-radius:18px;padding:12px 18px}
.panel textarea{min-height:150px;resize:vertical}
.btn{font:700 .95rem Manrope,sans-serif;border:0;border-radius:99px;padding:12px 26px;background:var(--orange);color:#fff3e6;cursor:pointer;margin-top:20px}
.btn:hover{background:var(--orange-d)}.btn[disabled]{opacity:.6;cursor:wait}
#rStatus{font-weight:700;color:var(--green);margin:0 0 8px}
footer{position:relative;overflow:hidden;margin-top:56px;padding:52px 20px 56px;text-align:center;color:#cfc6b2;background:var(--bg2);border-radius:46px 46px 0 0;border-top:1.5px solid var(--line)}
footer::before{content:"";position:absolute;left:50%;bottom:-280px;width:640px;height:640px;transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(246,240,225,.07) 0 1.2deg,transparent 1.2deg 7deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%)}
footer>*{position:relative}
footer h2{font:italic 700 2.1rem var(--disp);margin:0 0 6px;color:var(--ink)}
footer h2 em{color:var(--green)}
footer p{margin:4px 0}
footer .links2 a{color:var(--green);font-weight:700}
footer .small{font-size:.85rem;color:#9a8f7c;margin-top:20px}
@media(max-width:640px){
  .card{grid-template-columns:1fr}.card::before,.card::after{display:none}
  .stub{border-radius:32px 32px 0 0;border-right:0;border-bottom:2px dashed color-mix(in srgb,var(--cf) 38%,transparent);display:grid;place-items:center}
  .poster{position:relative;top:0;width:132px}
  .body{padding:20px 20px 8px}.panel{padding:22px}
}
.requl li{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1.5px dashed var(--line)}
.requl li.none{display:block;border:0}
.rcov{position:relative;flex:none;width:84px;aspect-ratio:2/3;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:var(--green);border:3px solid #f6f0e1;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.rcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rcov .ltr{font:700 2.2rem var(--disp);color:#2f2a24}
.rtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtxt b{font-size:1.1rem}.rtxt span{color:var(--muted);font-size:.9rem}
.opt{font-weight:500;color:var(--muted)}
.poster img,.rp img,.rcov img{opacity:0}
.poster img.ok,.rp img.ok,.rcov img.ok{opacity:1}
@media(prefers-reduced-motion:no-preference){.poster img,.rp img,.rcov img{transition:opacity .45s ease}}

/* ===== v2 tweaks: bigger text, hero photo, tools, phone layout ===== */
body{font-size:17px}
.blk{font-size:clamp(2.7rem,6.4vw,5.4rem)}
.sub{max-width:46ch;font-size:1rem;line-height:1.55}
.hmeta{font-size:.85rem;align-items:center}
.meta{font-size:1.02rem}.v h3{font-size:1.2rem}.where{font-size:1.05rem}
.pill{font-size:.82rem}.file{font-size:.92rem}.v p.f{font-size:1.02rem;line-height:1.6}
.req{font-size:.85rem;padding:5px 14px}
.intro{font-size:1.05rem}.stext{font-size:1.02rem}.snote{font-size:.92rem}
.ctile small{font-size:.9rem}.rtxt span{font-size:1rem}
.search,select{font-size:1rem}.panel{font-size:1.05rem}
.heroin::before{top:0;left:0;width:100%;height:100%;-webkit-mask:none;mask:none;animation:none;z-index:1;
  background:linear-gradient(90deg,rgba(33,29,25,.9) 0,rgba(33,29,25,.62) 48%,rgba(33,29,25,.3) 100%)}
.herobg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 28%;filter:blur(7px);transform:scale(1.08);z-index:0}
@media(max-width:640px){.heroin::before{background:linear-gradient(180deg,rgba(33,29,25,.8),rgba(33,29,25,.55))}}
.heroin::after{top:0;left:0;width:100%;height:100%;-webkit-mask:none;mask:none}
.tm{display:none}
.tg{position:absolute;top:22px;right:22px;width:36px;height:36px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--cf) 40%,transparent);background:transparent;color:var(--cf);display:grid;place-items:center;cursor:pointer;padding:0;z-index:2}
.tg:hover{background:color-mix(in srgb,var(--cf) 16%,transparent)}
.tg svg{transition:transform .2s}.card.collapsed .tg svg{transform:rotate(-90deg)}
h2.t{padding-right:48px}
.card.collapsed .viewings{display:none}.card.collapsed .body{padding-bottom:24px}
.toolrow{display:flex;justify-content:flex-end;margin:0 0 10px}
.mini{font:700 .85rem Manrope,sans-serif;color:var(--muted);background:none;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--green)}
#lb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(20,17,14,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:min(94vw,900px);max-height:90vh;object-fit:contain;border-radius:14px;border:4px solid #f6f0e1;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.poster:has(img.ok),.rcov:has(img.ok){cursor:zoom-in}
@media(max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 12px}
  nav{padding:8px 10px 0}
  .navin{border-radius:22px;padding:8px 12px;gap:6px 10px}
  .brand{font-size:.95rem;margin-right:auto;gap:4px}.brand i{font-size:1.2rem}
  #trade{display:none}
  .tm:not([hidden]){display:inline-flex;font-size:.72rem;padding:4px 11px}
  .reqbtn{font-size:.78rem;padding:7px 11px}.reqbtn b{margin-left:6px;padding:0 7px}
  .links{flex:0 0 100%;order:5;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
  .links::-webkit-scrollbar{display:none}
  .links a{padding:7px 12px;font-size:14px}
  .wrap.hero{padding-top:14px}
  .heroin{border-radius:22px}
  .hl{padding:20px 20px 6px;gap:16px}
  .blk{font-size:clamp(2.4rem,12.5vw,3.6rem)}.scr{font-size:clamp(2rem,9vw,2.6rem)}
  .sub{max-width:none;font-size:.88rem}
  .hr{padding:10px 14px 18px}.glass{padding:14px}
  #collection{padding-top:26px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tab{min-height:68px;padding:12px 14px;border-radius:20px;font-size:1.15rem}
  .alpha a,.alpha span{min-width:26px;padding:3px 5px;font-size:.85rem}
  .letter{font-size:2.3rem}.list{gap:20px}
  .card{grid-template-columns:92px 1fr;column-gap:14px;padding:16px 16px 4px;border-radius:24px}
  .stub{grid-column:1;grid-row:1/3;display:block;padding:0;border:0;background:none;border-radius:0}
  .poster{position:relative;top:0;width:92px;border-width:3px;border-radius:14px}
  .body{display:contents}
  h2.t{grid-column:2;grid-row:1;align-self:end;margin:0 0 4px;font-size:1.4rem;padding-right:42px}
  .meta{grid-column:2;grid-row:2;align-self:start;margin:0;font-size:.9rem}
  .viewings{grid-column:1/-1;grid-row:3;margin:16px 0 4px;padding-left:22px}
  .card.collapsed .viewings{display:none}
  .tg{top:14px;right:14px}
  .vh{flex-wrap:wrap}.cp{width:36px;height:36px}
  .where{font-size:.98rem}.v p.f{font-size:.95rem}
  .pg{padding-top:34px}.pt{font-size:2.4rem}.panel{padding:20px;border-radius:26px}
  .btn{width:100%}
  .rcov{width:64px}
  footer{border-radius:30px 30px 0 0}
}

/* footer sticks to the bottom on short pages */
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
body>.wrap{width:100%}
body>footer{margin-top:auto}
body>main,body>.page:not([hidden]){margin-bottom:56px}
.ph{font:italic 700 1.8rem/1.1 var(--disp);margin:26px 0 8px}.ph:first-child{margin-top:0}.pgmeta{margin:-8px 0 18px}
</style>
</head>
<body>
<nav id="nav"><div class="navin">
  <a class="brand" href="index.html"><i>WiredPossum4's</i>Collection</a>
  <div class="links"><a href="index.html">Home</a><a href="collection.html#collection">Collection</a><a href="wishlist.html">Wishlist</a><a class="on" href="contact.html">Contact &amp; Rules</a></div>
  <span class="trade" id="trade" hidden></span>
  <a class="reqbtn" href="collection.html#request">Request List <b id="reqN">0</b></a>
</div></nav>
<main class="wrap pg">
  <h1 class="pt">Contact &amp; <em>rules</em></h1>
  <div class="pgmeta"><span class="trade tm" id="trade2" hidden></span></div>
  <div class="panel" id="rules"></div>
  <div class="panel">
    <h2 class="ph">Get in touch</h2>
    <p id="rStatus" role="status"></p>
    <form id="cForm">
      <label for="cName">Your name</label>
      <input id="cName" type="text" required autocomplete="name" placeholder="Your name or username">
      <label for="cEmail">Your email</label>
      <input id="cEmail" type="email" required autocomplete="email" placeholder="you@example.com">
      <label for="cMsg">Message</label>
      <textarea id="cMsg" required placeholder="Write your message here."></textarea>
      <input type="text" id="cBot" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
      <button class="btn" type="submit" id="cSend">Send message</button>
    </form>
  </div>
</main>
<footer id="contact">
  <h2>You can <em>find me</em> on</h2>
  <p class="links2" id="contactLinks"></p>
  <p class="small">Last updated <span id="upd"></span></p>
</footer>
<script>
const DATA_PAGE = "data/collection.txt", RULES_PAGE = "data/rules.txt";
const FORM = { url: "https://api.web3forms.com/submit", accessKey: "7505f919-d54e-4854-9d0e-e676422bd271" };   // see README: free key from web3forms.com, requests go to your inbox
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const redditName = u => { const m = String(u || "").match(/\/(?:u|user)\/([^\/?#\s]+)/i); return m ? "u/" + m[1] : "Reddit"; };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DIRECTIVE = /^(updated|status note|status|email|reddit)\s*:\s*(.+)$/i;
const CONTACT = { email: "" };
function parseDate(t){ t = t.trim(); if(/^\d{4}(-\d{2}){0,2}$/.test(t)) return t;
  const m = t.match(/^([A-Za-z]+)\.?\s*(?:(\d{1,2})(?:st|nd|rd|th)?,?\s*)?(\d{4})$/);
  if(m){ const i = MONTHS.findIndex(x => x.toLowerCase().startsWith(m[1].slice(0, 3).toLowerCase()));
    if(i >= 0) return m[3] + "-" + String(i + 1).padStart(2, "0") + (m[2] ? "-" + String(m[2]).padStart(2, "0") : ""); }
  return t; }
function fmtDate(d){ if(!d) return ""; if(!/^\d{4}(-\d{2}){0,2}$/.test(d)) return d;
  const [y, m, day] = d.split("-").map(Number); return (m ? MONTHS[m-1] + " " : "") + (day ? day + ", " : "") + y; }
const STATUS_MAP = { active: { short: "Open for trade", tone: "" }, wants: { short: "Wants only", tone: "mid" }, gifts: { short: "Gifts only", tone: "mid" }, inactive: { short: "Not trading", tone: "off" } };
function statusInfo(v){ const t = String(v || "").toLowerCase();
  const k = /want/.test(t) ? "wants" : /gift/.test(t) ? "gifts" : /inactive|closed|not|off|pause|\bno\b/.test(t) ? "inactive" : /active|open|yes|\bon\b/.test(t) ? "active" : t ? "" : "active";
  return STATUS_MAP[k] || { short: String(v).slice(0, 22), tone: "mid" }; }
function siteInfo(text){ const out = { status: "", updated: "", email: "", reddit: "" };
  for(const raw of String(text).split(/\r?\n/)){ const line = raw.trim(); if(line.startsWith("//")) continue;
    const m = line.match(DIRECTIVE); if(!m) continue; const k = m[1].toLowerCase(), v = m[2].trim();
    if(k === "updated") out.updated = parseDate(v); else if(k === "status") out.status = v; else if(k === "email") out.email = v; else if(k === "reddit") out.reddit = v; }
  return out; }
function drawSite(d){
  const st = statusInfo(d.status), cls = "trade" + (st.tone ? " " + st.tone : "");
  $("trade").textContent = st.short; $("trade").className = cls; $("trade").hidden = false;
  $("trade2").textContent = st.short; $("trade2").className = cls + " tm"; $("trade2").hidden = false;
  CONTACT.email = d.email;
  $("upd").textContent = fmtDate(d.updated) || "–";
  $("contactLinks").innerHTML = [d.email && `<a href="mailto:${esc(d.email)}">${esc(d.email)}</a>`,
    d.reddit && `<a href="${esc(d.reddit)}" target="_blank" rel="noopener">${esc(redditName(d.reddit))}</a>`].filter(Boolean).join(" · "); }
/* rules text: # Heading, - bullet, plain lines = paragraphs */
function drawRules(text){ let html = "", list = false; const close = () => { if(list){ html += "</ul>"; list = false; } };
  for(const raw of String(text).split(/\r?\n/)){ const line = raw.trim(); if(!line || line.startsWith("//")) continue;
    const h = line.match(/^#+\s*(.+)$/), b = line.match(/^[-•*]\s+(.+)$/);
    if(h){ close(); html += `<h2 class="ph">${esc(h[1])}</h2>`; }
    else if(b){ if(!list){ html += "<ul>"; list = true; } html += `<li>${esc(b[1])}</li>`; }
    else { close(); html += `<p>${esc(line)}</p>`; } }
  close(); $("rules").innerHTML = html; $("rules").hidden = !html; }
async function getText(u){ const r = await fetch(u, { cache: "no-cache" }); if(!r.ok) throw 0; return r.text(); }
getText(DATA_PAGE).then(t => drawSite(siteInfo(t))).catch(() => drawSite({ status: "active", updated: "", email: "", reddit: "" }));
getText(RULES_PAGE).then(drawRules).catch(() => { $("rules").hidden = true; });

const setStatus = t => $("rStatus").textContent = t;
$("cForm").addEventListener("submit", async e => {
  e.preventDefault(); if($("cBot").value) return;
  const name = $("cName").value.trim(), email = $("cEmail").value.trim(), msg = $("cMsg").value.trim();
  if(!name || !email || !msg){ setStatus("Please fill in your name, your email and a message."); return; }
  const text = "Name: " + name + "\nEmail: " + email + "\n\nMessage:\n" + msg;
  if(!FORM.accessKey || /^PASTE/.test(FORM.accessKey)){ location.href = `mailto:${CONTACT.email}?subject=${encodeURIComponent("Message from " + name)}&body=${encodeURIComponent(text)}`; return; }
  const btn = $("cSend"); btn.disabled = true; setStatus("Sending…");
  try{
    const r = await fetch(FORM.url, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ access_key: FORM.accessKey, subject: "New message from " + name, from_name: "WiredPossum4's Collection", name, email, message: text }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok || j.success === false) throw 0;
    $("cMsg").value = ""; setStatus("Sent! I’ll reply to " + email + " soon.");
  }catch{ setStatus("That didn’t go through. Please try again" + (CONTACT.email ? ", or email me at " + CONTACT.email : "") + "."); }
  btn.disabled = false; });
try{ $("reqN").textContent = JSON.parse(localStorage.getItem("archive-requests") || "[]").length; }catch{}
new ResizeObserver(() => document.documentElement.style.setProperty("--nav", $("nav").offsetHeight + "px")).observe($("nav"));
</script>
</body>
</html>
